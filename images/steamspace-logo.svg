<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" role="img" aria-label="STEAM space">
  <style>
    .circle-letter { font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 14px; }
    .wordmark { font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 20px; }
    .wordmark-light { font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif; font-weight: 400; font-size: 20px; }
  </style>

  <!-- STEAM colored circles -->
  <circle cx="16" cy="20" r="14" fill="#9CDA65" />
  <text x="16" y="25" text-anchor="middle" class="circle-letter" fill="#3D3A36">S</text>

  <circle cx="44" cy="20" r="14" fill="#6AC8E4" />
  <text x="44" y="25" text-anchor="middle" class="circle-letter" fill="#3D3A36">T</text>

  <circle cx="72" cy="20" r="14" fill="#F3B456" />
  <text x="72" y="25" text-anchor="middle" class="circle-letter" fill="#3D3A36">E</text>

  <circle cx="100" cy="20" r="14" fill="#C786ED" />
  <text x="100" y="25" text-anchor="middle" class="circle-letter" fill="#3D3A36">A</text>

  <circle cx="128" cy="20" r="14" fill="#E88C8C" />
  <text x="128" y="25" text-anchor="middle" class="circle-letter" fill="#3D3A36">M</text>

  <!-- Wordmark: STEAM space -->
  <text x="152" y="26" class="wordmark" fill="#3D3A36">STEAM</text>
  <text x="203" y="26" class="wordmark-light" fill="#3D3A36">space</text>
</svg>