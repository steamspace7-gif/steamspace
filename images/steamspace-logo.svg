<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 44" role="img" aria-label="STEAM space">
  <style>
    text { font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif; }
    .circle { font-size: 15px; font-weight: 700; }
    .wordmark { font-size: 22px; font-weight: 700; }
    .wordmark-light { font-size: 22px; font-weight: 400; }
  </style>

  <!-- STEAM colored circles -->
  <circle cx="18" cy="22" r="15" fill="#9CDA65" />
  <text x="18" y="27" text-anchor="middle" class="circle" fill="#3D3A36">S</text>

  <circle cx="48" cy="22" r="15" fill="#6AC8E4" />
  <text x="48" y="27" text-anchor="middle" class="circle" fill="#3D3A36">T</text>

  <circle cx="78" cy="22" r="15" fill="#F3B456" />
  <text x="78" y="27" text-anchor="middle" class="circle" fill="#3D3A36">E</text>

  <circle cx="108" cy="22" r="15" fill="#C786ED" />
  <text x="108" y="27" text-anchor="middle" class="circle" fill="#3D3A36">A</text>

  <circle cx="138" cy="22" r="15" fill="#E88C8C" />
  <text x="138" y="27" text-anchor="middle" class="circle" fill="#3D3A36">M</text>

  <!-- Wordmark text: just "space" after the STEAM circles -->
  <text x="165" y="29" class="wordmark-light" fill="#3D3A36">space</text>
</svg>