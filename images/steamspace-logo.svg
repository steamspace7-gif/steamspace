<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" role="img" aria-label="Steamspace">
  <defs>
    <style>
      .letter { font-family: 'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 14px; }
    </style>
  </defs>

  <!-- S circle: green -->
  <circle cx="16" cy="20" r="14" fill="#9CDA65"/>
  <text x="16" y="25" text-anchor="middle" class="letter" fill="#3D3A36">S</text>

  <!-- T circle: teal -->
  <circle cx="44" cy="20" r="14" fill="#6AC8E4"/>
  <text x="44" y="25" text-anchor="middle" class="letter" fill="#3D3A36">T</text>

  <!-- E circle: orange -->
  <circle cx="72" cy="20" r="14" fill="#F3B456"/>
  <text x="72" y="25" text-anchor="middle" class="letter" fill="#3D3A36">E</text>

  <!-- A circle: purple -->
  <circle cx="100" cy="20" r="14" fill="#C786ED"/>
  <text x="100" y="25" text-anchor="middle" class="letter" fill="#3D3A36">A</text>

  <!-- M circle: pink/coral -->
  <circle cx="128" cy="20" r="14" fill="#E88C8C"/>
  <text x="128" y="25" text-anchor="middle" class="letter" fill="#3D3A36">M</text>

  <!-- Wordmark -->
  <text x="152" y="26" font-family="'Trebuchet MS','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#3D3A36">steamspace</text>
</svg>